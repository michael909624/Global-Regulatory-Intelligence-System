name: 运行 GRIS

# 仅手动触发
on:
  workflow_dispatch:
    inputs:
      command:
        description: "运行命令(默认 run --quick)"
        required: true
        default: "run --quick"
        type: choice
        options:
          - "run"
          - "run --quick"
          - "research"
          - "research --quick"
          - "scrape"
          - "analyze"
          - "report"
          - "status"

jobs:
  gris:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 初始化数据库
        run: python gris.py init
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 执行命令 — ${{ inputs.command }}
        run: python gris.py ${{ inputs.command }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 打包报告为 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gris-output-${{ github.run_number }}
          path: |
            reports/
            data/
            logs/
          retention-days: 7
          if-no-files-found: ignore
